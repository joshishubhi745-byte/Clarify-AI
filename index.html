<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClarifyAI - Clear Your Doubts</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #1a1a1a; color: #fff; }
        #chat-container { display: flex; flex-direction: column; width: 100%; max-width: 800px; margin: 0 auto; background: #2d2d2d; height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        #header { padding: 20px; background: #3d3d3d; text-align: center; font-size: 1.5rem; font-weight: bold; border-bottom: 1px solid #4d4d4d; color: #00ffcc; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; }
        .user { background: #007acc; align-self: flex-end; color: white; border-bottom-right-radius: 2px; }
        .bot { background: #444; align-self: flex-start; border-bottom-left-radius: 2px; border-left: 4px solid #00ffcc; }
        #input-container { display: flex; padding: 20px; background: #3d3d3d; gap: 10px; }
        #user-input { flex: 1; padding: 14px; border: none; border-radius: 8px; background: #222; color: white; font-size: 1rem; }
        #user-input:focus { outline: 2px solid #00ffcc; }
        #send-btn { padding: 0 24px; background: #00ffcc; color: #1a1a1a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        #send-btn:hover { background: #00cc99; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="header">🧠 ClarifyAI Tutor</div>
        <div id="chat-box">
            <div class="message bot">Hello! I am ClarifyAI, your personal tutor. What doubts can I help you clear up today?</div>
        </div>
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Ask me anything..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
